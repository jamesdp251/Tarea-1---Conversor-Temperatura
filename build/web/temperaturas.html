<html>
    <head>
        <title>TODO supply a title</title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
    </head>
    <body>
        <h2>Conversión de Temperaturas</h2>

        <form action="TemperaturasServlet" method="post">

            <label>Ingrese la temperatura:</label><br>
            <input type="number" name="temperatura" step="any" required>

            <br><br>

            <label>Seleccione la conversión:</label><br>

            <select name="conversion" required>
                <option value="">-- Seleccione una opción --</option>
                <option value="CF">Celsius → Fahrenheit</option>
                <option value="FC">Fahrenheit → Celsius</option>
                <option value="CK">Celsius → Kelvin</option>
                <option value="KC">Kelvin → Celsius</option>
            </select>

            <br><br>

            <input type="submit" value="Convertir">

        </form>
    </body>
</html>
